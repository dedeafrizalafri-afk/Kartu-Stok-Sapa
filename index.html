<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kartu Stok SAPA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#18212f}
header{background:#0f766e;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{font-size:13px;margin-top:5px;opacity:.9}
.wrap{max-width:1200px;margin:auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px #0001}.card small{color:#6b7280}
.card b{display:block;font-size:22px;margin-top:5px}
.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:8px}
input,button{font:inherit;padding:11px 12px;border-radius:9px;border:1px solid #d1d5db}
input{width:100%}button{background:#0f766e;color:white;border:0}
.status{font-size:12px;color:#6b7280;margin:8px 0}
.tablebox{background:white;border-radius:12px;overflow:auto;box-shadow:0 2px 10px #0001}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;white-space:nowrap}
th{background:#f0fdfa;color:#115e59}.num{text-align:right}
.badge{padding:4px 7px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:11px}
.warn{background:#fff7ed;color:#c2410c}.empty{text-align:center;padding:30px;color:#6b7280}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Kartu Stok SAPA</h1><div class="sub">OH Hand • OH Picking • Shipping • Belum Shipping • Stok Aktual</div></header>
<div class="wrap">
<div class="cards">
<div class="card"><small>Total Item</small><b id="totalItem">0</b></div>
<div class="card"><small>OH Hand</small><b id="totalHand">0</b></div>
<div class="card"><small>OH Picking</small><b id="totalPicking">0</b></div>
<div class="card"><small>Shipping</small><b id="totalShipping">0</b></div>
<div class="card"><small>Belum Shipping</small><b id="totalPending">0</b></div>
</div>
<div class="controls"><input id="search" placeholder="Cari barcode, PLU, nama barang, lokasi..."><button onclick="loadData()">↻ Refresh</button></div>
<div class="status" id="status">Mengambil data...</div>
<div class="tablebox"><table><thead><tr>
<th>Barcode</th><th>PLU</th><th>Nama Barang</th><th>Lokasi</th><th class="num">OH Hand</th><th class="num">OH Picking</th><th class="num">Shipping</th><th class="num">Belum Shipping</th><th class="num">Stok Aktual</th>
</tr></thead><tbody id="tbody"><tr><td colspan="9" class="empty">Mengambil data...</td></tr></tbody></table></div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxRa4JXvbLPGqQBr-GYDinXIEWfutcuMj-RNzDDuSwy6rZVZyldIWZ5TeuOdRxqiibuAQ/exec";
let allData=[];
const n=v=>Number(v)||0;
const fmt=v=>n(v).toLocaleString('id-ID');

async function loadData(){
 const s=document.getElementById('status');
 s.textContent='Mengambil data dari Google Sheet...';
 try{
  const r=await fetch(API_URL+'?action=stock&ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.ok)throw Error(j.error||'Gagal membaca data');
  allData=Array.isArray(j.data)?j.data:[];
  render();
  s.textContent='Data diperbarui • '+new Date().toLocaleTimeString('id-ID');
 }catch(e){
  s.textContent='Gagal mengambil data: '+e.message;
  document.getElementById('tbody').innerHTML='<tr><td colspan="9" class="empty">Data belum dapat dibaca. Cek deployment Web App.</td></tr>';
 }
}

function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const d=allData.filter(x=>!q||[x.barcode,x.plu,x.product,x.lokasi,x.dept].join(' ').toLowerCase().includes(q));
 document.getElementById('totalItem').textContent=fmt(d.length);
 document.getElementById('totalHand').textContent=fmt(d.reduce((a,x)=>a+n(x.ohHand),0));
 document.getElementById('totalPicking').textContent=fmt(d.reduce((a,x)=>a+n(x.ohPicking),0));
 document.getElementById('totalShipping').textContent=fmt(d.reduce((a,x)=>a+n(x.shipping),0));
 document.getElementById('totalPending').textContent=fmt(d.reduce((a,x)=>a+n(x.pending),0));

 document.getElementById('tbody').innerHTML=d.length?d.map(x=>{
   const warn=n(x.pending)>0?'warn':'';
   return '<tr><td>'+esc(x.barcode)+'</td><td>'+esc(x.plu)+'</td><td>'+esc(x.product)+'</td><td>'+esc(x.lokasi)+'</td><td class="num">'+fmt(x.ohHand)+'</td><td class="num">'+fmt(x.ohPicking)+'</td><td class="num"><span class="badge">'+fmt(x.shipping)+'</span></td><td class="num"><span class="badge '+warn+'">'+fmt(x.pending)+'</span></td><td class="num"><b>'+fmt(x.actual)+'</b></td></tr>';
 }).join(''):'<tr><td colspan="9" class="empty">Data tidak ditemukan</td></tr>';
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
document.getElementById('search').addEventListener('input',render);
loadData();
setInterval(loadData,120000);
</script>
</body>
</html>
